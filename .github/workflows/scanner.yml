name: Gem Setup Scanner

on:
  schedule:
    # IST = UTC + 5:30.  Market: 9:15 AM - 3:30 PM.
    # 9:15 AM -- din ka pehla scan (saare intraday TFs due nikalte hain).
    - cron: '45 3 * * 1-5'
    # 9:30 AM se 3:15 PM tak har 15 min. Har TF apne boundary par:
    # 30m -> 9:45, 45m -> 10:00, 1H -> 10:15, waghairah.
    - cron: '0,15,30,45 4-9 * * 1-5'
    # 3:30 PM -- market close.
    - cron: '0 10 * * 1-5'
    # 3:35 PM -- din ka aakhri, unified run. SIRF yahan higher timeframes
    # (1D/2D/3D/1W/1M) scan hote hain, aur saare intraday TFs force hote hain.
    - cron: '5 10 * * 1-5'
    #
    # Code mein bhi hard guard hai: 9:15 AM se pehle ya 4:00 PM ke baad
    # scanner turant exit ho jaata hai. Zaroori isliye ki GitHub ka cron
    # ghanton late fire hota hai -- is repo ke runs 23:38 IST tak chale hain.
  # Manually Actions tab se, aur app ke "Scan abhi chalao" button se.
  # force=true aane par scanner time guard chhod kar saare TF scan karta hai.
  # Baahar ka scheduler koi input nahi bhejta, to uske runs par force false
  # rehta hai aur purana vyavhaar waisa hi chalta hai.
  workflow_dispatch:
    inputs:
      force:
        description: 'Time guard ignore karke abhi poora scan chalao'
        type: boolean
        default: false

# Do run ek saath chalein to dono docs/feed.json push karne ki koshish
# karenge. Isliye runs queue mein chalte hain -- cancel nahi hote, bas ek
# ke baad ek. Jo run late pahunchega wo khud time-guard se nikal jayega.
concurrency:
  group: gem-scanner
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # app ki feed (docs/feed.json) commit karne ke liye
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FORCE_SCAN: ${{ inputs.force }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_5M: ${{ secrets.DISCORD_WEBHOOK_5M }}
          DISCORD_WEBHOOK_15M: ${{ secrets.DISCORD_WEBHOOK_15M }}
          DISCORD_WEBHOOK_30M: ${{ secrets.DISCORD_WEBHOOK_30M }}
          DISCORD_WEBHOOK_45M: ${{ secrets.DISCORD_WEBHOOK_45M }}
          DISCORD_WEBHOOK_1H: ${{ secrets.DISCORD_WEBHOOK_1H }}
          DISCORD_WEBHOOK_75M: ${{ secrets.DISCORD_WEBHOOK_75M }}
          DISCORD_WEBHOOK_2H: ${{ secrets.DISCORD_WEBHOOK_2H }}
          DISCORD_WEBHOOK_150M: ${{ secrets.DISCORD_WEBHOOK_150M }}
          DISCORD_WEBHOOK_3H: ${{ secrets.DISCORD_WEBHOOK_3H }}
          DISCORD_WEBHOOK_4H: ${{ secrets.DISCORD_WEBHOOK_4H }}
          DISCORD_WEBHOOK_HIGHER: ${{ secrets.DISCORD_WEBHOOK_HIGHER }}
          DISCORD_WEBHOOK_MIDBB_1D: ${{ secrets.DISCORD_WEBHOOK_MIDBB_1D }}
          DISCORD_WEBHOOK_MIDBB_2D: ${{ secrets.DISCORD_WEBHOOK_MIDBB_2D }}
          DISCORD_WEBHOOK_MIDBB_3D: ${{ secrets.DISCORD_WEBHOOK_MIDBB_3D }}
          DISCORD_WEBHOOK_MIDBB_1W: ${{ secrets.DISCORD_WEBHOOK_MIDBB_1W }}
          DISCORD_WEBHOOK_MIDBB_1M: ${{ secrets.DISCORD_WEBHOOK_MIDBB_1M }}
          DISCORD_WEBHOOK_MIDBB_6M: ${{ secrets.DISCORD_WEBHOOK_MIDBB_6M }}
          DISCORD_WEBHOOK_RSICROSS_INTRADAY: ${{ secrets.DISCORD_WEBHOOK_RSICROSS_INTRADAY }}
          DISCORD_WEBHOOK_RSICROSS_HIGHER: ${{ secrets.DISCORD_WEBHOOK_RSICROSS_HIGHER }}
        run: python gem_scanner.py

      - name: App feed commit karo
        if: always()
        run: |
          if [ ! -f docs/feed.json ]; then
            echo "Feed nahi bani -- is run mein koi timeframe due nahi tha."
            exit 0
          fi
          git config user.name "scan-by-akshay-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/feed.json
          if git diff --cached --quiet; then
            echo "Feed waisi hi hai, commit karne ki zaroorat nahi."
            exit 0
          fi
          git commit -m "Feed: $(TZ=Asia/Kolkata date '+%d %b %Y, %I:%M %p IST')"
          for attempt in 1 2 3; do
            if git push; then
              echo "Feed push ho gayi (koshish $attempt)."
              exit 0
            fi
            echo "Push fail -- origin se rebase karke dobara (koshish $attempt)."
            git pull --rebase --autostash origin main || true
          done
          echo "Feed push 3 koshish mein nahi hui."
          exit 1
