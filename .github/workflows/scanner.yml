name: Gem Setup Scanner

on:
  schedule:
    # IST = UTC + 5:30. Runs every 15 min, 9:15 AM - 3:15 PM IST, Mon-Fri.
    - cron: '45 3 * * 1-5'
    - cron: '*/15 4-9 * * 1-5'
  workflow_dispatch:   # lets you trigger it manually from the Actions tab to test

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_5M: ${{ secrets.DISCORD_WEBHOOK_5M }}
          DISCORD_WEBHOOK_15M: ${{ secrets.DISCORD_WEBHOOK_15M }}
          DISCORD_WEBHOOK_30M: ${{ secrets.DISCORD_WEBHOOK_30M }}
          DISCORD_WEBHOOK_45M: ${{ secrets.DISCORD_WEBHOOK_45M }}
          DISCORD_WEBHOOK_1H: ${{ secrets.DISCORD_WEBHOOK_1H }}
          DISCORD_WEBHOOK_75M: ${{ secrets.DISCORD_WEBHOOK_75M }}
          DISCORD_WEBHOOK_2H: ${{ secrets.DISCORD_WEBHOOK_2H }}
          DISCORD_WEBHOOK_150M: ${{ secrets.DISCORD_WEBHOOK_150M }}
          DISCORD_WEBHOOK_3H: ${{ secrets.DISCORD_WEBHOOK_3H }}
          DISCORD_WEBHOOK_4H: ${{ secrets.DISCORD_WEBHOOK_4H }}
          DISCORD_WEBHOOK_HIGHER: ${{ secrets.DISCORD_WEBHOOK_HIGHER }}
          DISCORD_WEBHOOK_MIDBB_1D: ${{ secrets.DISCORD_WEBHOOK_MIDBB_1D }}
          DISCORD_WEBHOOK_MIDBB_2D: ${{ secrets.DISCORD_WEBHOOK_MIDBB_2D }}
          DISCORD_WEBHOOK_MIDBB_3D: ${{ secrets.DISCORD_WEBHOOK_MIDBB_3D }}
          DISCORD_WEBHOOK_MIDBB_1W: ${{ secrets.DISCORD_WEBHOOK_MIDBB_1W }}
          DISCORD_WEBHOOK_MIDBB_1M: ${{ secrets.DISCORD_WEBHOOK_MIDBB_1M }}
          DISCORD_WEBHOOK_MIDBB_6M: ${{ secrets.DISCORD_WEBHOOK_MIDBB_6M }}
          DISCORD_WEBHOOK_RSICROSS_INTRADAY: ${{ secrets.DISCORD_WEBHOOK_RSICROSS_INTRADAY }}
          DISCORD_WEBHOOK_RSICROSS_HIGHER: ${{ secrets.DISCORD_WEBHOOK_RSICROSS_HIGHER }}
        run: python gem_scanner.py
